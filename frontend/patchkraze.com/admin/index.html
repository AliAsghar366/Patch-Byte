<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin – Patch Kraft</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/jpeg" href="/cdn/shop/files/Patch_Kraft_Logo.jpg">
  <link href="/js/admin.css" rel="stylesheet">
</head>
<body>

  <!-- ── Login ─────────────────────────────────────────────────────────── -->
  <div id="login-view" class="login-view" hidden>
    <div class="login-card">
      <img class="login-logo" src="/cdn/shop/files/Patch_Kraft_Logo.jpg" alt="Patch Kraft">
      <h1>Patch Kraft Admin</h1>
      <p class="login-sub">Orders · Analytics · Refunds</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Enter admin password" required>
        </div>
        <div id="login-error" class="alert alert-error" hidden></div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-foot"><a href="/">&larr; Back to store</a></p>
    </div>
  </div>

  <!-- ── App shell ─────────────────────────────────────────────────────── -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/cdn/shop/files/Patch_Kraft_Logo.jpg" alt="">
        <div>
          <strong>Patch Kraft</strong>
          <span>Admin Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-link" data-route="dashboard">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 1 1 16 0 8 8 0 0 1-16 0zm7-4a1 1 0 1 1 2 0v4a1 1 0 1 1-2 0V6zm0 6h6a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2z"/></svg>
          Dashboard
        </a>
        <a href="#/orders" class="nav-link" data-route="orders">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 1a1 1 0 0 0 0 2h1.22l.305 1.222a.997.997 0 0 0 .01.042l1.358 5.43-.893.446A2 2 0 0 0 4.26 13H16a1 1 0 1 0 0-2H5.33l.53-.266L7.1 8H14a2 2 0 0 0 1.94-1.56l1.1-4.94A1 1 0 0 0 16.17 1H3zm2 15a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
          Orders
          <span id="nav-order-count" class="nav-count" hidden></span>
        </a>
        <a href="#/reports" class="nav-link" data-route="reports">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 1 0 0-2H5V4a1 1 0 0 0-1-1zm2.5 4a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm4-1a1 1 0 0 1 1-1h4a1 1 0 1 1 0 2h-4a1 1 0 0 1-1-1zm-4 3a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm4-1a1 1 0 0 1 1-1h4a1 1 0 1 1 0 2h-4a1 1 0 0 1-1-1zm-4 3a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm4-1a1 1 0 0 1 1-1h4a1 1 0 1 1 0 2h-4a1 1 0 0 1-1-1z"/></svg>
          Reports
        </a>
      </nav>
      <div class="sidebar-foot">
        <a href="/" class="nav-link">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 0 0-1.414 0l-7 7a1 1 0 0 0 1.414 1.414L4 10.414V17a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-6.586l.293.293a1 1 0 0 0 1.414-1.414l-7-7z"/></svg>
          View Store
        </a>
        <button id="logout-btn" class="nav-link nav-btn">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 0 0-1 1v12a1 1 0 1 0 2 0V4a1 1 0 0 0-1-1zm10.293 2.293a1 1 0 0 1 1.414 0l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 0 1-1.414-1.414L15.586 11H7a1 1 0 1 1 0-2h8.586l-2.293-2.293a1 1 0 0 1 0-1.414z"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <div class="topbar-actions">
          <button id="refresh-btn" class="btn btn-ghost" title="Refresh data">↻ Refresh</button>
        </div>
      </header>
      <div id="alert-banner" class="alert-banner" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- ── Order drawer ──────────────────────────────────────────────────── -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Order details" hidden>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- ── Refund modal ──────────────────────────────────────────────────── -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/admin.js"></script>
</body>
</html>
